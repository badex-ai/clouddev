name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

env:
  DOCKERHUB_REPO_BACKEND: badex360/kaban-backend
  DOCKERHUB_REPO_CELERY: badex360/kaban-celery

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install ruff

      - name: Run Ruff linter
        run: |
          cd backend
          ruff check .

      - name: Run Ruff formatter check
        run: |
          cd backend
          ruff format --check .

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run tests
        env:
          ENVIRONMENT: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: test_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_DB: 0
          REDIS_PASSWORD: ""
          REDIS_USE_SSL: "false"
          CELERY_BROKER_HOST: localhost
          CELERY_BROKER_PORT: 6379
          CELERY_BROKER_DB: 1
          CELERY_BROKER_PASSWORD: ""
          CELERY_BROKER_USE_SSL: "false"
          CELERY_RESULT_HOST: localhost
          CELERY_RESULT_PORT: 6379
          CELERY_RESULT_DB: 2
          CELERY_RESULT_PASSWORD: ""
          CELERY_RESULT_USE_SSL: "false"
          AUTH0_DOMAIN: "test.auth0.com"
          AUTH0_CLIENT_ID: "test"
          AUTH0_CLIENT_SECRET: "test"
          AUTH0_API_AUDIENCE: "test"
          AUTH0_M2M_CLIENT_ID: "test"
          AUTH0_M2M_CLIENT_SECRET: "test"
          CORS_ALLOWED_ORIGINS: "http://localhost:3000"
        run: |
          cd backend
          pytest --cov=. --cov-report=xml -v || echo "No tests found or tests failed"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "sha_tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "date_tag=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: staging
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO_BACKEND }}:staging
            ${{ env.DOCKERHUB_REPO_BACKEND }}:${{ steps.meta.outputs.sha_tag }}
            ${{ env.DOCKERHUB_REPO_BACKEND }}:staging-${{ steps.meta.outputs.date_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push celery image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: celery-worker
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO_CELERY }}:staging
            ${{ env.DOCKERHUB_REPO_CELERY }}:${{ steps.meta.outputs.sha_tag }}
            ${{ env.DOCKERHUB_REPO_CELERY }}:staging-${{ steps.meta.outputs.date_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER_NAME }} --region ${{ vars.AWS_REGION }}

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.13.0'

      - name: Deploy with Helm
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          helm upgrade --install kaban-backend ./infrastructure/k8s/charts/backend \
            --namespace kaban \
            --create-namespace \
            -f ./infrastructure/k8s/values-aws-staging.yaml \
            --set image.tag=${SHORT_SHA} \
            --set celeryWorker.image.tag=${SHORT_SHA} \
            --set configMap.data.BREVO_SENDER_EMAIL=${{ vars.BREVO_SENDER_EMAIL }} \
            --wait \
            --timeout 5m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/kaban-backend -n kaban --timeout=3m
          kubectl rollout status deployment/kaban-backend-celery-worker -n kaban --timeout=3m

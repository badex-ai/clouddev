name: Deploy to Production

on:
  # Manual trigger with inputs
  workflow_dispatch:
    inputs:
      backend_tag:
        description: 'Backend image tag to deploy (e.g., abc1234 or staging-20250112)'
        required: true
        type: string
      frontend_tag:
        description: 'Frontend image tag to deploy (e.g., abc1234 or staging-20250112)'
        required: true
        type: string
      confirm_production:
        description: 'Type "production" to confirm deployment'
        required: true
        type: string

env:
  DOCKERHUB_REPO_BACKEND: badex360/kaban-backend
  DOCKERHUB_REPO_CELERY: badex360/kaban-celery
  DOCKERHUB_REPO_FRONTEND: badex360/kaban-frontend

jobs:
  validate:
    name: Validate Inputs
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_production }}" != "production" ]; then
            echo "::error::You must type 'production' to confirm deployment"
            exit 1
          fi
          echo "✅ Production deployment confirmed"

      - name: Validate image tags
        run: |
          if [ -z "${{ github.event.inputs.backend_tag }}" ]; then
            echo "::error::Backend tag is required"
            exit 1
          fi
          if [ -z "${{ github.event.inputs.frontend_tag }}" ]; then
            echo "::error::Frontend tag is required"
            exit 1
          fi
          echo "✅ Deploying backend:${{ github.event.inputs.backend_tag }}, frontend:${{ github.event.inputs.frontend_tag }}"

  verify-images:
    name: Verify Images Exist
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify backend image exists
        run: |
          docker manifest inspect ${{ env.DOCKERHUB_REPO_BACKEND }}:${{ github.event.inputs.backend_tag }} || \
            (echo "::error::Backend image not found: ${{ env.DOCKERHUB_REPO_BACKEND }}:${{ github.event.inputs.backend_tag }}" && exit 1)
          echo "✅ Backend image verified"

      - name: Verify celery image exists
        run: |
          docker manifest inspect ${{ env.DOCKERHUB_REPO_CELERY }}:${{ github.event.inputs.backend_tag }} || \
            (echo "::error::Celery image not found: ${{ env.DOCKERHUB_REPO_CELERY }}:${{ github.event.inputs.backend_tag }}" && exit 1)
          echo "✅ Celery image verified"

      - name: Verify frontend image exists
        run: |
          docker manifest inspect ${{ env.DOCKERHUB_REPO_FRONTEND }}:${{ github.event.inputs.frontend_tag }} || \
            (echo "::error::Frontend image not found: ${{ env.DOCKERHUB_REPO_FRONTEND }}:${{ github.event.inputs.frontend_tag }}" && exit 1)
          echo "✅ Frontend image verified"

  deploy-backend:
    name: Deploy Backend to Production
    runs-on: ubuntu-latest
    needs: verify-images
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER_NAME }} --region ${{ vars.AWS_REGION }}

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.13.0'

      - name: Deploy Backend with Helm
        run: |
          helm upgrade --install kaban-backend ./infrastructure/k8s/charts/backend \
            --namespace kaban \
            --create-namespace \
            -f ./infrastructure/k8s/values-aws-prod.yaml \
            --set image.tag=${{ github.event.inputs.backend_tag }} \
            --set celeryWorker.image.tag=${{ github.event.inputs.backend_tag }} \
            --wait \
            --timeout 5m

      - name: Verify backend deployment
        run: |
          kubectl rollout status deployment/kaban-backend -n kaban --timeout=3m
          kubectl rollout status deployment/kaban-backend-celery-worker -n kaban --timeout=3m

  deploy-frontend:
    name: Deploy Frontend to Production
    runs-on: ubuntu-latest
    needs: verify-images
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER_NAME }} --region ${{ vars.AWS_REGION }}

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.13.0'

      - name: Deploy Frontend with Helm
        run: |
          helm upgrade --install kaban-frontend ./infrastructure/k8s/charts/frontend \
            --namespace kaban \
            --create-namespace \
            -f ./infrastructure/k8s/values-aws-prod.yaml \
            --set image.tag=${{ github.event.inputs.frontend_tag }} \
            --wait \
            --timeout 5m

      - name: Verify frontend deployment
        run: |
          kubectl rollout status deployment/kaban-frontend -n kaban --timeout=3m

  notify:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always()
    steps:
      - name: Deployment summary
        run: |
          echo "## Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Image Tag | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | ${{ github.event.inputs.backend_tag }} | ${{ needs.deploy-backend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Celery | ${{ github.event.inputs.backend_tag }} | ${{ needs.deploy-backend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ github.event.inputs.frontend_tag }} | ${{ needs.deploy-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

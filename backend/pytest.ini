[pytest]
# Add the root directory to Python path
pythonpath = .

# Test file patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test markers
markers =
    benchmark: marks tests as performance benchmarks
    asyncio: marks tests as async tests

# Disable warnings that might interfere with test output
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning

# Verbose output
addopts = -v

# Test discovery starts from this directory
testpaths = tests
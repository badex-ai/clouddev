
# docker-compose.dev.yaml (Development overrides)
# Usage: docker compose -f docker-compose.yaml -f docker-compose.dev.yaml up

services:
  backend:
    build:
      target: dev
    image: badex360/kaban-backend:dev
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - kaban_network
    environment:
      DOCKER_CONTAINER: "true"
      ENVIRONMENT: ${ENVIRONMENT}
      DEBUG: "true"
      # CORS
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
       # Database
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # Auth0
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET}
      AUTH0_API_AUDIENCE: ${AUTH0_API_AUDIENCE}
      AUTH0_M2M_CLIENT_ID: ${AUTH0_M2M_CLIENT_ID}
      AUTH0_M2M_CLIENT_SECRET: ${AUTH0_M2M_CLIENT_SECRET}
      BREVO_API_KEY: ${BREVO_API_KEY}

      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DB: ${REDIS_DB}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_USE_SSL: "false"

      CELERY_BROKER_HOST: ${CELERY_BROKER_HOST}
      CELERY_BROKER_PORT: ${CELERY_BROKER_PORT}
      CELERY_BROKER_DB: ${CELERY_BROKER_DB}
      CELERY_BROKER_PASSWORD: ${CELERY_BROKER_PASSWORD}
      CELERY_BROKER_USE_SSL: "false"
     

      # Celery Result Backend
      CELERY_RESULT_HOST: ${CELERY_RESULT_HOST}
      CELERY_RESULT_PORT: ${CELERY_RESULT_PORT}
      CELERY_RESULT_DB: ${CELERY_RESULT_DB}
      CELERY_RESULT_PASSWORD: ${CELERY_RESULT_PASSWORD}
      CELERY_RESULT_USE_SSL: "false"
   
 
     
    volumes:
      - ./logs:/app/logs
      - ./backend:/app
      - /app/__pycache__  # Exclude pycache from host
    depends_on:
      - postgres
      - redis
    # Development-specific settings
    tty: true
    stdin_open: true


  celery-worker:
    build:
      context: ./backend
      target: celery-worker
    image: badex360/kaban-celery:dev
    networks:
      - kaban_network
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      DOCKER_CONTAINER: "true" 
      # Database
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # Auth0
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_M2M_CLIENT_ID: ${AUTH0_M2M_CLIENT_ID}
      AUTH0_M2M_CLIENT_SECRET: ${AUTH0_M2M_CLIENT_SECRET}
      BREVO_API_KEY: ${BREVO_API_KEY}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL}
      # Redis
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB}

      # Redis (local)
    
      REDIS_USE_SSL: "false"

      CELERY_BROKER_HOST: ${CELERY_BROKER_HOST}
      CELERY_BROKER_PORT: ${CELERY_BROKER_PORT}
      CELERY_BROKER_DB: ${CELERY_BROKER_DB}
      CELERY_BROKER_PASSWORD: ${CELERY_BROKER_PASSWORD}
      CELERY_BROKER_USE_SSL: "false"

   

      CELERY_RESULT_HOST: ${CELERY_RESULT_HOST}
      CELERY_RESULT_PORT: ${CELERY_RESULT_PORT}
      CELERY_RESULT_DB: ${CELERY_RESULT_DB}
      CELERY_RESULT_PASSWORD: ${CELERY_RESULT_PASSWORD}
      CELERY_RESULT_USE_SSL: "false"
      # CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      # CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
    volumes:
      - ./backend:/app
      - /app/__pycache__
    depends_on:
      - redis
      - postgres

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    networks:
      - kaban_network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

    
  frontend:
    build:
      target: dev
    image: badex360/kaban-frontend:dev
    command: npm run dev
    networks:
      - kaban_network
    environment:
      NODE_ENV: development
      # Enable hot reloading
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
       # Auth0
      AUTH0_SECRET: ${AUTH0_SECRET}
      AUTH0_BASE_URL: ${AUTH0_BASE_URL}
      AUTH0_ISSUER_BASE_URL: ${AUTH0_ISSUER_BASE_URL}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET}
      AUTH0_SCOPE: ${AUTH0_SCOPE}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      # App config
      APP_BASE_URL: ${APP_BASE_URL}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      BACKEND_URL: ${BACKEND_URL}
    volumes:
      # Enable hot reloading by mounting source code
      - ./frontend:/app
      - /app/node_modules      # Exclude node_modules from host
      - /app/.next            # Cache Next.js builds
    # Development-specific settings
    tty: true
    stdin_open: true
  
  postgres:
    ports:
      - "5433:5432"
    networks:
      - kaban_network
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  redis_data:
  postgres_data:

networks:
  kaban_network:
    driver: bridge
# docker-compose.staging.yaml (Staging overrides for AWS deployment)
# Usage: docker compose -f docker-compose.yaml -f docker-compose.staging.yaml up

services:
  backend:
    image: badex360/kaban-backend:staging
    build:
      target: staging
    command: gunicorn main:app -w 2 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000
    environment:
      ENVIRONMENT: staging
      DEBUG: "false"
      LOG_LEVEL: "info"
      # CORS
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://staging.yourdomain.com}
      # Database
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # Auth0
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET}
      AUTH0_API_AUDIENCE: ${AUTH0_API_AUDIENCE}
      AUTH0_M2M_CLIENT_ID: ${AUTH0_M2M_CLIENT_ID}
      AUTH0_M2M_CLIENT_SECRET: ${AUTH0_M2M_CLIENT_SECRET}
      BREVO_API_KEY: ${BREVO_API_KEY}
      # Redis
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DB: ${REDIS_DB}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_USE_SSL: ${REDIS_USE_SSL:-true}
      # Celery Broker
      CELERY_BROKER_HOST: ${CELERY_BROKER_HOST}
      CELERY_BROKER_PORT: ${CELERY_BROKER_PORT}
      CELERY_BROKER_DB: ${CELERY_BROKER_DB}
      CELERY_BROKER_PASSWORD: ${CELERY_BROKER_PASSWORD}
      CELERY_BROKER_USE_SSL: ${CELERY_BROKER_USE_SSL:-true}
      # Celery Result Backend
      CELERY_RESULT_HOST: ${CELERY_RESULT_HOST}
      CELERY_RESULT_PORT: ${CELERY_RESULT_PORT}
      CELERY_RESULT_DB: ${CELERY_RESULT_DB}
      CELERY_RESULT_PASSWORD: ${CELERY_RESULT_PASSWORD}
      CELERY_RESULT_USE_SSL: ${CELERY_RESULT_USE_SSL:-true}
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  celery-worker:
    image: badex360/kaban-celery:staging
    build:
      target: celery-worker
    environment:
      ENVIRONMENT: staging
      DOCKER_CONTAINER: "true"
      # Database
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # Auth0
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_M2M_CLIENT_ID: ${AUTH0_M2M_CLIENT_ID}
      AUTH0_M2M_CLIENT_SECRET: ${AUTH0_M2M_CLIENT_SECRET}
      BREVO_API_KEY: ${BREVO_API_KEY}
      # Redis
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB}
      REDIS_USE_SSL: ${REDIS_USE_SSL:-true}
      # Celery
      CELERY_BROKER_HOST: ${CELERY_BROKER_HOST}
      CELERY_BROKER_PORT: ${CELERY_BROKER_PORT}
      CELERY_BROKER_DB: ${CELERY_BROKER_DB}
      CELERY_BROKER_PASSWORD: ${CELERY_BROKER_PASSWORD}
      CELERY_BROKER_USE_SSL: ${CELERY_BROKER_USE_SSL:-true}
      CELERY_RESULT_HOST: ${CELERY_RESULT_HOST}
      CELERY_RESULT_PORT: ${CELERY_RESULT_PORT}
      CELERY_RESULT_DB: ${CELERY_RESULT_DB}
      CELERY_RESULT_PASSWORD: ${CELERY_RESULT_PASSWORD}
      CELERY_RESULT_USE_SSL: ${CELERY_RESULT_USE_SSL:-true}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: badex360/kaban-frontend:staging
    build:
      target: staging
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      # Auth0
      AUTH0_SECRET: ${AUTH0_SECRET}
      AUTH0_BASE_URL: ${AUTH0_BASE_URL}
      AUTH0_ISSUER_BASE_URL: ${AUTH0_ISSUER_BASE_URL}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET}
      AUTH0_SCOPE: ${AUTH0_SCOPE}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      # App config
      APP_BASE_URL: ${APP_BASE_URL}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      BACKEND_URL: ${BACKEND_URL}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.125'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

global:
  namespace: kaban 

ingress:
  enabled: true
  className: nginx  # nginx for local
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: kaban.local    # fake local domain for frontend
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: kaban-frontend-service
              port:
                number: 80
    - host: api.kaban.local      # fake local domain for backend
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: kaban-backend-service
              port:
                number: 80



database:
  host: "192.168.0.110"  # Your local PostgreSQL host
  port: 5432
  name: "clouddev"
  user: "ali"
  local: true


frontend:
  service:
    type: ClusterIP
    port: 80
    targetPort: 3000
  
  configMap:
    data:
      AUTH0_BASE_URL: "http://kaban.local"
      AUTH0_ISSUER_BASE_URL: "dev-b58ldaey.us.auth0.com"
      AUTH0_CLIENT_ID: "WS4vRguNb8CxhvU8vDYUC0f8w2LT0hfs"
      AUTH0_SCOPE: "openid profile email"
      AUTH0_AUDIENCE: "https://dev-b58ldaey.us.auth0.com/userinfo"
      APP_BASE_URL: "http://kaban.local"
      AUTH0_DOMAIN: "dev-b58ldaey.us.auth0.com"
      NEXT_PUBLIC_API_URL: "http://api.kaban.local"
      ENVIRONMENT: "devk8s"
      BACKEND_URL: "http://kaban-backend-service"


backend: 
  configMap: 
      data:
        AUTH0_DOMAIN: "dev-b58ldaey.us.auth0.com"
        AUTH0_CLIENT_ID: "WS4vRguNb8CxhvU8vDYUC0f8w2LT0hfs"
        AUTH0_API_AUDIENCE: "http://kaban.local"
        AUTH0_M2M_CLIENT_ID: "7FBTiFT94EPx0MCoorcPAwgM771nTTiX"
        DB_HOST:  "192.168.0.110"   # RDS endpoint
        DB_PORT: "5432"
        DB_NAME: "clouddev"
        DB_USER: "ali"
        ENVIRONMENT: "devk8s"
        # 🔥 NEW: Redis config (points to Docker Compose Redis)
        REDIS_HOST: "192.168.0.110"
        REDIS_PORT: "6379"
        REDIS_DB: "0"
        REDIS_USE_SSL: "false"
        # 🔥 NEW: Celery broker
        CELERY_BROKER_HOST: "192.168.0.110"
        CELERY_BROKER_PORT: "6379"
        CELERY_BROKER_DB: "1"
        CELERY_BROKER_USE_SSL: "false"
        # 🔥 NEW: Celery result backend
        CELERY_RESULT_HOST: "192.168.0.110"
        CELERY_RESULT_PORT: "6379"
        CELERY_RESULT_DB: "2"
        CELERY_RESULT_USE_SSL: "false"

  celeryWorker:
    replicaCount: 1
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "512Mi"
        cpu: "500m"

  # 🔥 NEW: Network policy for Redis access
  networkPolicy:
    ingress:
      ingressControllerNamespace:
        kubernetes.io/metadata.name: ingress
    egress:
      allowDatabase: true
      database:
        useIPBlock: true
        cidr: "192.168.0.110/32"
        port: 5432
      allowRedis: true
      redis:
        useIPBlock: true              # TRUE for external
        cidr: "192.168.0.110/32"     


  redis:
    enabled: false  # Deploy Redis in local-dev
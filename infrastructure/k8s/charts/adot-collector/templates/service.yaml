apiVersion: v1
kind: Service
metadata:
  name: adot-collector
  namespace: {{ .Values.namespace }}
  labels:
    app: adot-collector
spec:
  type: {{ .Values.service.type }}
  ports:
  - name: otlp-grpc
    port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.targetPort }}
    protocol: TCP
  - name: otlp-http
    port: 4318
    targetPort: 4318
    protocol: TCP
  - name: metrics
    port: 8888
    targetPort: 8888
    protocol: TCP
  - name: healthcheck
    port: 13133
    targetPort: 13133
    protocol: TCP
  selector:
    app: adot-collector

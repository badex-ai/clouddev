{{- if .Values.configMap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "backend.fullname" . }}-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.configMap.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- if and .Values.configMap.data.REDIS_HOST .Values.configMap.data.REDIS_PORT .Values.configMap.data.REDIS_DB }}
  # REDIS_URL: {{ printf "redis://%s:%s/%s" .Values.configMap.data.REDIS_HOST .Values.configMap.data.REDIS_PORT .Values.configMap.data.REDIS_DB | quote }}
  # {{- end }}
  # {{- if and .Values.configMap.data.CELERY_BROKER_HOST .Values.configMap.data.CELERY_BROKER_PORT .Values.configMap.data.CELERY_BROKER_DB }}
  # CELERY_BROKER_URL: {{ printf "redis://%s:%s/%s" .Values.configMap.data.CELERY_BROKER_HOST .Values.configMap.data.CELERY_BROKER_PORT .Values.configMap.data.CELERY_BROKER_DB | quote }}
  # {{- end }}
  # {{- if and .Values.configMap.data.CELERY_RESULT_HOST .Values.configMap.data.CELERY_RESULT_PORT .Values.configMap.data.CELERY_RESULT_DB }}
  # CELERY_RESULT_BACKEND: {{ printf "redis://%s:%s/%s" .Values.configMap.data.CELERY_RESULT_HOST .Values.configMap.data.CELERY_RESULT_PORT .Values.configMap.data.CELERY_RESULT_DB | quote }}
  # {{- end }}
{{- end }}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "backend.fullname" . }}-network-policy
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "backend.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress

  ingress:
    {{- if .Values.networkPolicy.ingress.allowFromFrontend }}
    # Allow from frontend pods
    - from:
        - podSelector:
            matchLabels:
              app: {{ .Values.networkPolicy.ingress.frontendAppLabel }}
      ports:
        - protocol: TCP
          port: {{ .Values.container.port }}
    {{- end }}

    {{- if .Values.networkPolicy.ingress.allowFromIngressController }}
    # Allow from Ingress Controller
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingress.ingressControllerNamespace | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.container.port }}
    {{- end }}

  egress:
    # 1. DNS - CRITICAL for service discovery
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    {{- if .Values.networkPolicy.egress.allowDatabase }}
    # 2. Database (PostgreSQL)
    {{- if .Values.networkPolicy.egress.database.useIPBlock }}
    # For external DB (host machine or RDS)
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.egress.database.cidr }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.database.port }}
    {{- else }}
    # For in-cluster PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.egress.database.podSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.database.port }}
    {{- end }}
    {{- end }}

    {{- if .Values.networkPolicy.egress.allowRedis }}
    # 3. Redis/ElastiCache
    {{- if .Values.networkPolicy.egress.redis.useIPBlock }}
    # For ElastiCache (AWS)
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.egress.redis.cidr }}
      ports:
        - protocol: TCP
          port: 6379
    {{- else }}
    # For in-cluster Redis
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.egress.redis.podSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: 6379
    {{- end }}
    {{- end }}

    {{- if .Values.networkPolicy.egress.allowExternal }}
    # 4. External HTTPS (Auth0, Brevo)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
      ports:
        {{- range .Values.networkPolicy.egress.externalPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
{{- end }}
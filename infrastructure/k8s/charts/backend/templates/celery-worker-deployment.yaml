apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "backend.fullname" . }}-celery-worker
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
    app.kubernetes.io/component: celery-worker
spec:
  replicas: {{ .Values.celeryWorker.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "backend.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: celery-worker
  template:
    metadata:
      labels:
        {{- include "backend.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: celery-worker
    spec:
      {{- if .Values.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- end }}
      containers:
      - name: celery-worker
        {{- if .Values.securityContext }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        {{- end }}
        {{- if .Values.celeryWorker.image }}
        image: "{{ .Values.celeryWorker.image.repository }}:{{ .Values.celeryWorker.image.tag | default .Values.image.tag }}"
        imagePullPolicy: {{ .Values.celeryWorker.image.pullPolicy | default .Values.image.pullPolicy }}
        {{- else }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- end }}
        command: 
          - celery
          - -A
          - config.celery.celery_app
          - worker
          - --loglevel=info
          - --concurrency=4
          - --max-tasks-per-child=1000
        env:
          {{- range $key, $value := .Values.configMap.data }}
          - name: {{ $key }}
            valueFrom:
              configMapKeyRef:
                name: {{ include "backend.fullname" $ }}-config
                key: {{ $key }}
          {{- end }}
          
          # Secret values (sensitive) - ADDED THIS BLOCK
          {{- if .Values.secrets.enabled }}
          {{- range $key, $value := .Values.secrets.data }}
          - name: {{ $key }}
            valueFrom:
              secretKeyRef:
                name: {{ include "backend.fullname" $ }}-secrets
                key: {{ $key }}
          {{- end }}
          {{- end }}
          
          # Additional env vars for celery worker (from values.celeryWorker.env)
          {{- if .Values.celeryWorker.env }}
          {{- range .Values.celeryWorker.env }}
          - name: {{ .name }}
            value: {{ .value | quote }}
          {{- end }}
          {{- end }}
        
        # ✅ ADDED: Mount secrets as files (like Deployment A)
        {{- if .Values.volumeMounts }}
        volumeMounts:
          {{- toYaml .Values.volumeMounts | nindent 12 }}
        {{- end }}
        {{- if .Values.celeryWorker.resources }}
        resources:
          {{- toYaml .Values.celeryWorker.resources | nindent 12 }}
        {{- end }}
      {{- if .Values.volumes }}
      volumes:
        {{- range .Values.volumes }}
        - name: {{ .name }}
          secret:
            secretName: {{ include "backend.fullname" $ }}-secrets
            defaultMode: 0440
            optional: {{ .secret.optional }}
            {{- with .secret.items }}
            items:
              {{- toYaml . | nindent 14 }}
            {{- end }}
        {{- end }}
      {{- end }}
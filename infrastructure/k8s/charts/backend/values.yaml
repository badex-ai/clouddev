#***POD***
replicaCount: 1

image:
  repository: badex360/kaban-backend
  tag: latest
  pullPolicy:  Always

 

imagePullSecrets: []

namespace: "local-dev"

migration:
  enabled: true


# This is for setting Kubernetes Annotations to a Pod.
podAnnotations: {}
podLabels: {}
component: api

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}


# ***service****
service:
  type: ClusterIP
  port: 8000
  targetPort: 8000




resources: 
  requests:
    memory: 256Mi
    cpu: 250m
  limits:
    memory: 512Mi
    cpu: 500m
  

container: 
  port: 8000
  

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 60  # Give app time to start
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 70




nodeSelector: {}

tolerations: []

affinity: {}

configMap:
  enabled: true
  data: {}


# 🔒 Secrets (sensitive data)
secrets:
    enabled: true

volumes:
  - name: backend-secrets-volume
    secret:
      optional: false
      items:
        - key: AUTH0_CLIENT_SECRET
          path: AUTH0_CLIENT_SECRET
        - key: AUTH0_M2M_CLIENT_SECRET
          path: AUTH0_M2M_CLIENT_SECRET
        - key: DB_PASSWORD
          path: DB_PASSWORD
        - key: REDIS_PASSWORD
          path: REDIS_PASSWORD
        - key: CELERY_BROKER_PASSWORD
          path: CELERY_BROKER_PASSWORD
        - key: CELERY_RESULT_PASSWORD
          path: CELERY_RESULT_PASSWORD
        - key: BREVO_API_KEY
          path: BREVO_API_KEY

# Additional volumeMounts on the output Deployment definition.
volumeMounts:
  - name: backend-secrets-volume
    mountPath: /etc/secrets
    readOnly: true


# NetworkPolicy configuration
networkPolicy:
  enabled: true
  
  ingress:
    allowFromFrontend: true
    frontendAppLabel: frontend
    allowFromIngressController: true
    ingressControllerNamespace:
      kubernetes.io/metadata.name: ingress

  egress:
    dnsSelector:
      k8s-app: kube-dns
    
    allowDatabase: false
    database:
      useIPBlock: false
      cidr: ""
      podSelector: {}
      port: 5432
    
    allowRedis: false
    redis:
      useIPBlock: false
      cidr: ""
      podSelector: {}
      port: 6379
    
    allowExternal: true
    externalPorts:
      - 443
      - 80
  

vpc:
  cidr: "10.0.0.0/16" 

# Security configuration
securityGroupId: "" 

celeryWorker:
  replicaCount: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

redis:
    enabled: true  
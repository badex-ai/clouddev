{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "frontend.fullname" . }}-network-policy
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "frontend.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  - Egress
  
  # 🌐 WHO can send traffic TO frontend
  ingress:
  {{- if .Values.networkPolicy.ingress.allowFromIngressController }}
  # Allow from Ingress Controller
  - from:
    - namespaceSelector:
        matchLabels:
          {{- toYaml .Values.networkPolicy.ingress.ingressControllerNamespace | nindent 10 }}
    ports:
    - protocol: TCP
      port: {{ .Values.container.port }}
  {{- end }}

  # 🌐 WHERE frontend can send traffic TO
  egress:
  {{- if .Values.networkPolicy.egress.allowDNS }}
  # 1. DNS
  - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
        podSelector:
          matchLabels:
            k8s-app: kube-dns
    ports:
      - protocol: UDP
        port: 53
      - protocol: TCP
        port: 53
  {{- end }}

  {{- if .Values.networkPolicy.egress.allowBackend }}
  # 2. Backend service
  - to:
    - podSelector:
        matchLabels:
          app: {{ .Values.networkPolicy.egress.backend.appLabel }}
    ports:
    {{- range .Values.networkPolicy.egress.backend.ports }}
    - protocol: TCP
      port: {{ . }}
    {{- end }}
  {{- end }}

  {{- if .Values.networkPolicy.egress.allowExternal }}
  # 3. External access (HTTP/HTTPS)
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 169.254.169.254/32
    ports:
    {{- range .Values.networkPolicy.egress.externalPorts }}
    - protocol: TCP
      port: {{ . }}
    {{- end }}
  {{- end }}
{{- end }}
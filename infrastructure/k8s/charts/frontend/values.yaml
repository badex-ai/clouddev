replicaCount: 1

global:
  namespace: "default"

image:
  repository: badex360/kaban-frontend
  tag: latest
  pullPolicy: Always

externalSecrets:
  enabled: false
  refreshInterval: "1h"
  secretName: ""

configMap:
  enabled: true
  data: {}
  

# Secrets (sensitive data)
secrets:
    enabled: true

  
# VolumeMount configuration
volumeMounts:

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

resources: 
  requests:
    memory: 256Mi
    cpu: 250m
  limits:
    memory: 512Mi
    cpu: 500m

networkPolicy: 
  enabled: true
  ingress:
    allowFromIngressController: false  # Default to false
    ingressControllerNamespace:
      kubernetes.io/metadata.name: kube-system  # Default namespace

  egress:
    allowDNS: true  # Always needed
    
    allowBackend: true  # Default to false
    backend:
      appLabel: backend
      ports: []  # Empty by default
    
    allowADOT: true  # Default to false
    adot:
      appLabel: adot-collector
      ports: []
    
    allowExternal: true  # Default to false
    externalPorts: []

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 70

container: 
  port: 3000





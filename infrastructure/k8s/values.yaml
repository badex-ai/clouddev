
database:
 local: false

aws:
  region: ""

externalSecrets:
  enabled: false


  
ingress:
  enabled: true

frontend:
  name: kaban-frontend
  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 1001
  
  containerSecurityContext:
    runAsUser: 1001
    runAsGroup: 1001
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL
  externalSecrets:
    enabled: false
    refreshInterval: "1h"
    secretName: ""
  secrets: {}

backend: 
  name: kaban-backend
  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 1001
  
  containerSecurityContext:
    runAsUser: 1001
    runAsGroup: 1001
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL
  
  externalSecrets:
    enabled: false
    refreshInterval: "1h"
    secretName: ""
  secrets: {}


serviceAccount:
  create: false

service: 
  port: 80

httpRoute:
  enabled: false

networkPolicy:
  enabled: true
  
  ingress:
    allowFromFrontend: true
    frontendAppLabel: frontend
    allowFromIngressController: true
  
  egress:
    dnsSelector:
      k8s-app: kube-dns
    allowExternal: true
    externalPorts:
      - 443
      - 80

  
# Staging environment values for AWS EKS deployment
# These values will be populated with Terraform outputs after infrastructure is created
# Run: terraform output -json to get the actual values
#
# DEPLOYMENT STEPS:
# 1. Run: terraform apply → get DB/Redis endpoints
# 2. Update DB_HOST, REDIS_HOST, CELERY_*_HOST below
# 3. Deploy: helm upgrade --install ...
# 4. Get ALB DNS: kubectl get ingress -n kaban
# 5. Update ALB_DNS_PLACEHOLDER below with actual ALB DNS
# 6. Redeploy: helm upgrade --install ...
# 7. Update Auth0 callback URLs with the ALB DNS
#
# NOTE: This file is used by BOTH backend and frontend charts.
# When deploying backend: values under root level are used
# When deploying frontend: values under root level are used
# The 'global' section is shared by both.

global:
  namespace: kaban
  albDns: "k8s-kaban-kabaning-9bbac5ac2a-1301918061.us-west-2.elb.amazonaws.com"

# AWS Configuration
aws:
  region: "us-west-2"  # Must match your EKS cluster region

# External Secrets - ClusterSecretStore configuration
externalSecrets:
  enabled: true

# ============================================
# LOGGING CONFIGURATION
# ============================================
logging:
  enabled: true
  cloudwatch:
    enabled: true
    region: "us-west-2"

# ============================================
# INGRESS CONFIGURATION (shared)
# ============================================
ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    # HTTP only (no custom domain/certificate)
    # To enable HTTPS later: add certificate-arn and change listen-ports to include 443
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/actions.weighted-routing: |
      {
        "type": "forward",
        "forwardConfig": {
          "targetGroups": [
             {
              "serviceName": "kaban-frontend-service",
              "servicePort": 80,
              "weight": 60
            },
            {
              "serviceName": "kaban-frontend-canary-service",
              "servicePort": 80,
              "weight": 40
            }
          ]
        }
      }
 
  hosts:
    - paths:
        - path: /api
          pathType: Prefix
          backend:
            service:
              name: kaban-backend-service
              port:
                number: 8000
        - path: /
          pathType: Prefix
          backend:
            service:
              name: weighted-routing  
              port:
                name: use-annotation

# ============================================
# BACKEND CHART VALUES (nested under backend: for subchart)
# ============================================
backend:
  component: api
  replicaCount: 1

  strategy:                    
    type: Recreate

  env:
    - name: LOG_SOURCE
      value: "backend"
    - name: CLOUDWATCH_LOG_GROUP
      value: "/kaban/staging/backend"

  image:
    repository: badex360/kaban-backend
    tag: latest
    pullPolicy: Always

  container:
    port: 8000

  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000

  # ExternalSecrets configuration for backend
  externalSecrets:
    enabled: true
    refreshInterval: "1h"
    secretName: "kaban/staging/backend"

  configMap:
    enabled: true
    data:
      # CORS configuration
      CORS_ALLOWED_ORIGINS: "http://k8s-kaban-kabaning-9bbac5ac2a-1301918061.us-west-2.elb.amazonaws.com"
      AUTH0_DOMAIN: "dev-b58ldaey.us.auth0.com"
      AUTH0_CLIENT_ID: "WS4vRguNb8CxhvU8vDYUC0f8w2LT0hfs"
      AUTH0_API_AUDIENCE: "http://k8s-kaban-kabaning-9bbac5ac2a-1301918061.us-west-2.elb.amazonaws.com/api"
      AUTH0_M2M_CLIENT_ID: "7FBTiFT94EPx0MCoorcPAwgM771nTTiX"
      # Database - populated from Terraform output
      DB_HOST: "kaban-staging-postgres.cn08y2iymedv.us-west-2.rds.amazonaws.com"
      DB_PORT: "5432"
      DB_NAME: "kaban_staging"
      DB_USER: "postgres"
      ENVIRONMENT: "staging"
      # ElastiCache - populated from Terraform output
      REDIS_HOST: "master.kaban-staging.te9wwx.usw2.cache.amazonaws.com"
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_USE_SSL: "true"
      # Celery broker (same ElastiCache, different DB)
      CELERY_BROKER_HOST: "master.kaban-staging.te9wwx.usw2.cache.amazonaws.com"
      CELERY_BROKER_PORT: "6379"
      CELERY_BROKER_DB: "1"
      CELERY_BROKER_USE_SSL: "true"
      # Celery result backend (same ElastiCache, different DB)
      CELERY_RESULT_HOST: "master.kaban-staging.te9wwx.usw2.cache.amazonaws.com"
      CELERY_RESULT_PORT: "6379"
      CELERY_RESULT_DB: "2"
      CELERY_RESULT_USE_SSL: "true"
      # Email - Passed via GitHub Environment Variable in CI/CD
      BREVO_SENDER_EMAIL: "badamasi.link@gmail.com"
      

  celeryWorker:
    replicaCount: 1
    image:
      repository: badex360/kaban-celery-worker
      tag: latest
      pullPolicy: Always
    env:
      - name: LOG_SOURCE
        value: "celery"
      - name: CLOUDWATCH_LOG_GROUP
        value: "/kaban/staging/celery"
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "512Mi"
        cpu: "500m"

  networkPolicy:
    enabled: true
    ingress:
      allowFromFrontend: true
      frontendAppLabel: frontend
      allowFromIngressController: true
      ingressControllerNamespace:
        kubernetes.io/metadata.name: kube-system
    egress:
      allowDatabase: true
      database:
        useIPBlock: true
        cidr: "10.1.0.0/16"
        port: 5432
      allowRedis: true
      redis:
        useIPBlock: true
        cidr: "10.1.0.0/16"
      allowExternal: true
      externalPorts:
        - 443
        - 80

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# ============================================
# FRONTEND CHART VALUES (nested under frontend: for subchart)
# ============================================
frontend:
  replicaCount: 1

  strategy:                    
    type: Recreate

  image:
    repository: badex360/kaban-frontend
    tag: latest
    pullPolicy: Always

  container:
    port: 3000

  service:
    type: ClusterIP
    port: 80
    targetPort: 3000
  
  canary:
    enabled: true
    replicas: 1
    image:
      repository: badex360/kaban-frontend-canary
      tag: latest

  # ExternalSecrets configuration for frontend
  externalSecrets:
    enabled: true
    refreshInterval: "1h"
    secretName: "kaban/staging/frontend"

  # Frontend needs to know which secret keys to load as env vars
  secrets:
    enabled: true
    data:
      AUTH0_SECRET: ""
      AUTH0_CLIENT_SECRET: ""

  configMap:
    enabled: true
    data:
      # Auth0 Configuration
      AUTH0_BASE_URL: "http://k8s-kaban-kabaning-9bbac5ac2a-1301918061.us-west-2.elb.amazonaws.com"
      AUTH0_ISSUER_BASE_URL: "https://dev-b58ldaey.us.auth0.com"
      AUTH0_DOMAIN: "dev-b58ldaey.us.auth0.com"
      AUTH0_CLIENT_ID: "WS4vRguNb8CxhvU8vDYUC0f8w2LT0hfs"
      AUTH0_SCOPE: "openid profile email"
      AUTH0_AUDIENCE: "https://dev-b58ldaey.us.auth0.com/userinfo"
      # Application URLs
      APP_BASE_URL: "http://k8s-kaban-kabaning-9bbac5ac2a-1301918061.us-west-2.elb.amazonaws.com"
      NEXT_PUBLIC_API_URL: "http://k8s-kaban-kabaning-9bbac5ac2a-1301918061.us-west-2.elb.amazonaws.com/api"
      BACKEND_URL: "http://kaban-backend-service:8000"
      ENVIRONMENT: "staging"
      # Logging - Distinguish this component's logs
      LOG_SOURCE: "frontend"
      CLOUDWATCH_LOG_GROUP: "/kaban/staging/frontend"

  networkPolicy:
    enabled: true
    ingress:
      allowFromIngressController: true
      ingressControllerNamespace:
        kubernetes.io/metadata.name: kube-system
    egress:
      allowDNS: true
      allowBackend: true
      backend:
        appLabel: backend
        ports:
          - 8000
      allowExternal: true
      externalPorts:
        - 443

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Redis disabled - Using ElastiCache in staging
redis:
  enabled: false

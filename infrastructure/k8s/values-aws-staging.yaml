# Staging environment values for AWS EKS deployment
# These values will be populated with Terraform outputs after infrastructure is created
# Run: terraform output -json to get the actual values

global:
  namespace: kaban

externalSecrets:
  enabled: true

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
  hosts:
    - host: staging.yourdomain.com  # Update with your staging domain
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: frontend-service
              port:
                number: 80
                targetPort: 3000
    - host: api.staging.yourdomain.com  # Update with your staging API domain
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: backend-service
              port:
                number: 80
                targetPort: 8000


frontend:
  replicaCount: 1

  service:
    type: ClusterIP
    port: 80
    targetPort: 3000

  configMap:
    data:
      AUTH0_BASE_URL: "https://staging.yourdomain.com"
      AUTH0_ISSUER_BASE_URL: "dev-b58ldaey.us.auth0.com"
      AUTH0_CLIENT_ID: "WS4vRguNb8CxhvU8vDYUC0f8w2LT0hfs"
      AUTH0_SCOPE: "openid profile email"
      AUTH0_AUDIENCE: "https://dev-b58ldaey.us.auth0.com/userinfo"
      APP_BASE_URL: "https://staging.yourdomain.com"
      AUTH0_DOMAIN: "dev-b58ldaey.us.auth0.com"
      NEXT_PUBLIC_API_URL: "https://api.staging.yourdomain.com"
      ENVIRONMENT: "staging"
      BACKEND_URL: "http://kaban-backend-service:8000"
      NEXT_PUBLIC_SENTRY_DSN: "https://8dd285561bd6f4a49a10618251cffb4f@o1106601.ingest.us.sentry.io/4510500123574272"

  externalSecrets:
    enabled: true
    refreshInterval: "1h"
    secretName: "kaban/staging/frontend"  # Matches Terraform secret name

  image:
    repository: your-dockerhub-username/kaban-frontend
    tag: latest
    pullPolicy: Always

  networkPolicy:
    enabled: true
    ingress:
      allowFromIngressController: true
      ingressControllerNamespace:
        kubernetes.io/metadata.name: kube-system
    egress:
      allowDNS: true
      allowBackend: true
      backend:
        appLabel: backend
        ports: [80, 8000]
      allowADOT: true
      adot:
        appLabel: adot-collector
        ports:
          - 4317
          - 4318
      allowExternal: true
      externalPorts:
        - 443
        - 80


backend:
  replicaCount: 1

  container:
    port: 8000

  configMap:
    data:
      # CORS - comma-separated list of allowed origins
      CORS_ALLOWED_ORIGINS: "https://staging.yourdomain.com,https://yourdomain.com"
      AUTH0_DOMAIN: "dev-b58ldaey.us.auth0.com"
      AUTH0_CLIENT_ID: "WS4vRguNb8CxhvU8vDYUC0f8w2LT0hfs"
      AUTH0_API_AUDIENCE: "https://api.staging.yourdomain.com"
      AUTH0_M2M_CLIENT_ID: "7FBTiFT94EPx0MCoorcPAwgM771nTTiX"
      # Database - populate from Terraform output: db_instance_endpoint
      DB_HOST: ""  # From: terraform output db_instance_endpoint
      DB_PORT: "5432"
      DB_NAME: "kaban_staging"
      DB_USER: "postgres"
      ENVIRONMENT: "staging"
      # OpenTelemetry/ADOT Configuration
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://adot-collector.aws-otel-eks.svc.cluster.local:4317"
      OTEL_SERVICE_NAME: "kaban-backend"
      # ElastiCache - populate from Terraform output: elasticache_endpoint
      REDIS_HOST: ""  # From: terraform output elasticache_endpoint
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_USE_SSL: "true"
      # Celery broker (same ElastiCache, different DB)
      CELERY_BROKER_HOST: ""  # From: terraform output elasticache_endpoint
      CELERY_BROKER_PORT: "6379"
      CELERY_BROKER_DB: "1"
      CELERY_BROKER_USE_SSL: "true"
      # Celery result backend (same ElastiCache, different DB)
      CELERY_RESULT_HOST: ""  # From: terraform output elasticache_endpoint
      CELERY_RESULT_PORT: "6379"
      CELERY_RESULT_DB: "2"
      CELERY_RESULT_USE_SSL: "true"

  celeryWorker:
    replicaCount: 1
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "512Mi"
        cpu: "500m"

  networkPolicy:
    enabled: true
    ingress:
      allowFromFrontend: true
      frontendAppLabel: frontend
      allowFromIngressController: true
      ingressControllerNamespace:
        kubernetes.io/metadata.name: kube-system
    egress:
      allowDatabase: true
      database:
        useIPBlock: true
        cidr: "10.0.0.0/16"  # Staging VPC CIDR (from Terraform)
        port: 5432
      allowRedis: true
      redis:
        useIPBlock: true
        cidr: "10.0.0.0/16"  # Staging VPC CIDR (from Terraform)
      allowADOT: true
      adot:
        podSelector:
          app: adot-collector
        ports:
          - 4317
          - 4318
      allowExternal: true
      externalPorts:
        - 443

  externalSecrets:
    enabled: true
    refreshInterval: "1h"
    secretName: "kaban/staging/backend"  # Matches Terraform secret name

  image:
    repository: your-dockerhub-username/kaban-backend
    tag: latest
    pullPolicy: Always

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

redis:
  enabled: false  # Using ElastiCache in staging

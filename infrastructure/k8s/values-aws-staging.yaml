ingress:
  enabled: true
  className: alb  # alb for AWS
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
  hosts:
    - host: myapp.com
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: frontend-service
              port:
                number: 80
                targetPort: 3000 
    - host: api.myapp.com
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: backend-service
              port:
                number: 80
                targetPort: 8000 




frontend:
  service:
    type: loadBalancer
    port: 80
    targetPort: 3000
  externalSecrets:
    enabled: true
    refreshInterval: "1h"
    secretName: "kaban/staging/frontend"  # ← Matches Terraform secret name
  
  image:
    repository: your-dockerhub-username/kaban-frontend
    tag: latest
    pullPolicy: Always

  config:
    AUTH0_ISSUER_BASE_URL: "https://your-tenant.auth0.com"


backend:
  configMap:
    data:
      AUTH0_DOMAIN: "dev-b58ldaey.us.auth0.com"
      AUTH0_CLIENT_ID: "WS4vRguNb8CxhvU8vDYUC0f8w2LT0hfs"
      AUTH0_API_AUDIENCE: "https://api.myapp.com"
      AUTH0_M2M_CLIENT_ID: "7FBTiFT94EPx0MCoorcPAwgM771nTTiX"
      DB_HOST: "my-rds-endpoint.us-east-1.rds.amazonaws.com"
      DB_PORT: "5432"
      DB_NAME: "clouddev"
      DB_USER: "admin"
      ENVIRONMENT: "production"
      # 🔥 NEW: ElastiCache endpoint (from Terraform output)
      REDIS_HOST: "my-elasticache.abc123.use1.cache.amazonaws.com"
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_USE_SSL: "true"
      # 🔥 NEW: Celery broker (same ElastiCache)
      CELERY_BROKER_HOST: "my-elasticache.abc123.use1.cache.amazonaws.com"
      CELERY_BROKER_PORT: "6379"
      CELERY_BROKER_DB: "1"
      CELERY_BROKER_USE_SSL: "true"
      # 🔥 NEW: Celery result backend
      CELERY_RESULT_HOST: "my-elasticache.abc123.use1.cache.amazonaws.com"
      CELERY_RESULT_PORT: "6379"
      CELERY_RESULT_DB: "2"
      CELERY_RESULT_USE_SSL: "true"
  
  # 🔥 NEW: Scale workers for production
  celeryWorker:
    replicaCount: 2
  
  # 🔥 NEW: Network policy for ElastiCache
  networkPolicy:
    ingress:
      ingressControllerNamespace:
        kubernetes.io/metadata.name: kube-system
    egress:
      allowDatabase: true
      database:
        useIPBlock: true
        cidr: "10.0.0.0/16"
        port: 5432
      allowRedis: true
      redis:
        useIPBlock: true
        cidr: "10.0.0.0/16"
      allowADOT: true
      adot:
        podSelector:
          app: adot-collector
        ports:
          - 4317
          - 4318
  externalSecrets:
    enabled: true
    refreshInterval: "1h"
    secretName: "kaban/staging/backend"  # ← Matches Terraform secret name
  
  image:
    repository: your-dockerhub-username/kaban-backend
    tag: latest
    pullPolicy: Always

  config:
    # Non-sensitive config only - secrets come from External Secrets
    AUTH0_DOMAIN: "your-tenant.auth0.com"
    AUTH0_AUDIENCE: "your-api-audience"

redis:
  # Storage
  persistence:
    enabled: false  # Use emptyDir for local dev
    size: 1Gi
    storageClass: ""